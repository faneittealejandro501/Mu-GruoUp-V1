name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check application
        run: bun run typecheck:app

      - name: Verify game assets
        run: bun run verify:flyff

      - name: Build
        env:
          VITE_WORLD_SERVER_URL: ${{ vars.VITE_WORLD_SERVER_URL }}
          VITE_BACKUP_URL: ${{ vars.VITE_BACKUP_URL }}
        run: bun run build

      - name: Run release tests
        run: bun run test:release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Package Android client
        env:
          MU_ANDROID_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && secrets.MU_ANDROID_KEYSTORE_B64 || '' }}
          MU_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.MU_ANDROID_KEY_ALIAS || '' }}
          MU_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MU_ANDROID_STORE_PASSWORD || '' }}
          MU_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.MU_ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$MU_ANDROID_KEYSTORE_B64" && "$GITHUB_REF" == refs/heads/main ]]; then
            export MU_ANDROID_KEYSTORE="$(mktemp)"
            trap 'rm -f "$MU_ANDROID_KEYSTORE"' EXIT
            printf %s "$MU_ANDROID_KEYSTORE_B64" | base64 --decode > "$MU_ANDROID_KEYSTORE"
            bun run build:android dist/MuGro-up-Android.apk
            mkdir -p build/android
            cp dist/MuGro-up-Android.apk build/android/
          else
            bun run build:android
          fi

      - name: Upload Android client
        uses: actions/upload-artifact@v7
        with:
          name: mugroup-android
          path: build/android/MuGro-up-Android.apk
          if-no-files-found: error
          compression-level: 0

      - name: Add Pages marker
        run: touch dist/.nojekyll

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v7
        with:
          name: mugroup-web
          path: dist
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Explain Pages setup
        if: steps.pages.outcome == 'failure'
        run: |
          echo '::error::Activa GitHub Pages en Settings > Pages y elige GitHub Actions. GitHub Free requiere un repositorio público; para mantenerlo privado se necesita un plan compatible. Luego vuelve a ejecutar el flujo.'
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
