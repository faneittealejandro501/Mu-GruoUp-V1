name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      account_origin:
        description: Origen HTTPS público del servidor de cuentas (opcional si ya está configurado)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check application
        run: bun run typecheck:app

      - name: Verify game assets
        run: bun run verify:flyff

      - name: Build
        env:
          REQUIRE_ACCOUNT_SERVICE: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
          VITE_WORLD_SERVER_URL: ${{ vars.VITE_WORLD_SERVER_URL || secrets.VITE_WORLD_SERVER_URL }}
          VITE_BACKUP_URL: ${{ inputs.account_origin || vars.VITE_BACKUP_URL || secrets.VITE_BACKUP_URL }}
        run: |
          node scripts/write-server-connection.mjs "$RUNNER_TEMP/server-connection.json"
          export VITE_BACKUP_URL="$(node -p 'require(process.argv[1]).origin' "$RUNNER_TEMP/server-connection.json")"
          bun run build
          cp "$RUNNER_TEMP/server-connection.json" dist/server-connection.json

      - name: Run release tests
        run: bun run test:release

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Package Android client
        env:
          MU_ANDROID_KEYSTORE_B64: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.MU_ANDROID_KEYSTORE_B64 || '' }}
          MU_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.MU_ANDROID_KEY_ALIAS || '' }}
          MU_ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.MU_ANDROID_STORE_PASSWORD || '' }}
          MU_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && secrets.MU_ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$MU_ANDROID_KEYSTORE_B64" ]]; then
            export MU_ANDROID_KEYSTORE="$(mktemp)"
            trap 'rm -f "$MU_ANDROID_KEYSTORE"' EXIT
            printf %s "$MU_ANDROID_KEYSTORE_B64" | base64 --decode > "$MU_ANDROID_KEYSTORE"
          fi
          bun run build:android dist/MuGro-up-Android.apk
          test -s dist/android-download.json

      - name: Upload Android client
        uses: actions/upload-artifact@v7
        with:
          name: mugroup-android
          path: dist/MuGro-up-Android.apk
          if-no-files-found: error
          compression-level: 0

      - name: Add Pages marker
        run: touch dist/.nojekyll

      - name: Upload downloadable web build
        uses: actions/upload-artifact@v7
        with:
          name: mugroup-web
          path: dist
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      - name: Explain Pages setup
        if: steps.pages.outcome == 'failure'
        run: |
          echo '::error::Activa GitHub Pages en Settings > Pages y elige GitHub Actions. GitHub Free requiere un repositorio público; para mantenerlo privado se necesita un plan compatible. Luego vuelve a ejecutar el flujo.'
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
